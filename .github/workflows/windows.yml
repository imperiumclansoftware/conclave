# Builds Conclave for Windows: tests, self-contained application (launched once to check it
# starts), Inno Setup installer. On a version tag (v0.4.0), the installer is attached to the
# GitHub release; otherwise it is kept as an artifact of the run (Actions tab).
name: Application Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # A change to the application is built and checked (no release)
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Version
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Conclave pour Windows $version"

      - name: Tests
        run: dotnet test --project tests/Conclave.Desktop.Core.Tests -c Release

      - name: Application
        run: dotnet publish src/Conclave.Desktop -c Release -r win-x64 -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Launch check
        run: |
          if (-not (Test-Path publish/Conclave.pri)) { throw 'Conclave.pri absent de la publication : WinUI ne trouverait pas ses thèmes.' }
          $log = Join-Path $env:LOCALAPPDATA 'Conclave\conclave.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process publish/Conclave.exe -PassThru
          Start-Sleep -Seconds 20
          $crashed = (Test-Path $log) -and (Select-String -Path $log -Pattern 'Unhandled exception' -Quiet)
          if ($app.HasExited -or $crashed) {
            if (Test-Path $log) { Get-Content $log }
            throw "Conclave ne démarre pas (fermé : $($app.HasExited))."
          }
          Stop-Process -Id $app.Id -Force
          if (Test-Path $log) { Get-Content $log }
          Write-Output 'Conclave démarre.'

      - name: Installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ';C:\Program Files (x86)\Inno Setup 6'
          }
          iscc /DAppVersion=${{ steps.version.outputs.version }} installer/Conclave.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Conclave-Setup-${{ steps.version.outputs.version }}
          path: windows/dist/*.exe

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/Conclave-Setup-${{ steps.version.outputs.version }}.exe
