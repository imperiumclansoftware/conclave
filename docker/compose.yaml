# Conclave with its database and its Discord worker.
#   Command line: cp .env.example .env (then fill it in), docker compose up -d
#   Portainer: paste this file as a stack and enter the variables of .env.example in "Environment variables"
#   Installation code: docker compose exec conclave php bin/console app:setup:code (or the container logs)

# Settings of both Conclave containers, taken from the variables of the stack (.env or Portainer)
x-conclave-environment: &conclave-environment
  CONCLAVE_URL: ${CONCLAVE_URL:?CONCLAVE_URL must be set, e.g. http://192.168.1.10:8080}
  APP_SECRET: ${APP_SECRET:?APP_SECRET must be set (openssl rand -hex 32)}
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE must be set (openssl rand -hex 32)}
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET must be set (openssl rand -hex 32)}
  DATABASE_URL: postgresql://conclave:${POSTGRES_PASSWORD}@database:5432/conclave?serverVersion=16&charset=utf8
  # Time zone of the dates in the e-mails
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}

services:
  conclave:
    image: iemperor/conclave:${CONCLAVE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${CONCLAVE_PORT:-8080}:80"
    environment: *conclave-environment
    volumes:
      - conclave_data:/data
    depends_on:
      database:
        condition: service_healthy

  # Discord presences and video calls (optional: configure Discord in the administration)
  discord-worker:
    image: iemperor/conclave:${CONCLAVE_VERSION:-latest}
    restart: unless-stopped
    command: ["php", "bin/console", "app:discord:gateway"]
    environment:
      <<: *conclave-environment
      # Publishes the real-time events through the hub of the web container
      MERCURE_URL: http://conclave/.well-known/mercure
    healthcheck:
      disable: true
    volumes:
      - conclave_data:/data
    depends_on:
      conclave:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conclave
      POSTGRES_USER: conclave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "conclave", "-U", "conclave"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  conclave_data:
  database_data:
