security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        # Secrets of the machine clients (OAuth2 client credentials, App\OAuth\ClientCredentials)
        oauth_client_secret:
            algorithm: sodium

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/login$
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        # Export for the clan's public portal: opaque access tokens of machine clients (POST /oauth/token)
        portal:
            pattern: ^/api/portal/members$
            stateless: true
            custom_authenticators: [App\OAuth\BearerTokenAuthenticator]
            entry_point: App\OAuth\BearerTokenAuthenticator
            access_denied_handler: App\OAuth\BearerTokenAuthenticator
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/(login|register|health)$, roles: PUBLIC_ACCESS }
        # The Windows application checks its version before anyone signs in
        - { path: ^/api/desktop/windows(/download)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/setup(/verify)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/password/(forgot|reset)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/avatars/, roles: PUBLIC_ACCESS }
        - { path: ^/api/news-images/, roles: PUBLIC_ACCESS }
        # Portal export: avatars under signed URLs, the list with the scope portal:members
        - { path: ^/api/portal/avatars/, roles: PUBLIC_ACCESS }
        - { path: ^/api/portal/members$, roles: ROLE_OAUTH_PORTAL_MEMBERS }
        - { path: ^/api/admin, roles: ROLE_LEADER }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            oauth_client_secret:
                algorithm: sodium
                time_cost: 3
                memory_cost: 10
