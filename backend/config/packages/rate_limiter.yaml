framework:
    rate_limiter:
        # Installation code: a few attempts per address, then wait
        setup_code:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # OAuth2 token endpoint (machine clients, e.g. the public portal every 15 minutes)
        oauth_token:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
