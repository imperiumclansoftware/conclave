
services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure:${MERCURE_VERSION:-v1.1}
    restart: unless-stopped
    environment:
      # Plain HTTP for local development
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET must be set}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET must be set}
      # Must match the "iss" claim of the tokens minted by Symfony (MERCURE_ISSUER)
      MERCURE_TRUSTED_ISSUERS: ${MERCURE_ISSUER:-http://localhost:8000}
      # The app publishes through the internal URL and browsers subscribe through
      # the Angular proxy, so pin one audience shared by both (MERCURE_AUDIENCE)
      # Over plain HTTP, browsers drop "__Secure-" cookies: use the prefix-less name
      # Symfony sends in debug mode
      MERCURE_EXTRA_DIRECTIVES: |
        resource_identifier ${MERCURE_AUDIENCE:-http://localhost:4200/.well-known/mercure}
        cookie_name mercure_access_token
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost/"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
